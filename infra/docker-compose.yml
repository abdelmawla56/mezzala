# MEZZALA dev infrastructure: Postgres 16 (+ least-privilege roles), MinIO (S3 stand-in), media worker.
# The web app is not containerised: run it with `npm run dev` in apps/web (port 3600).
name: mezzala
services:
  db:
    image: postgres:16
    container_name: mezzala-pg
    environment:
      POSTGRES_USER: mezzala
      POSTGRES_DB: mezzala_gclub
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD (make env)}
      MZ_APP_PASSWORD: ${MZ_APP_PASSWORD:?set MZ_APP_PASSWORD}
      MZ_WORKER_PASSWORD: ${MZ_WORKER_PASSWORD:?set MZ_WORKER_PASSWORD}
    ports: ["5442:5432"]
    volumes:
      - mezzala-pg:/var/lib/postgresql/data
      - ./scripts/create-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro   # runs on an empty volume only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mezzala -d mezzala_gclub"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:                       # docker compose run --rm migrate up | rollback | status
    image: ghcr.io/amacneil/dbmate:2
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://mezzala:${PGPASSWORD}@db:5432/mezzala_gclub?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes: ["./db/migrations:/db/migrations:ro"]
    command: ["--wait", "up"]
    restart: "no"

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:3600}   # browser multipart PUT from the app
    ports: ["9000:9000", "9001:9001"]
    volumes: ["mezzala-minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    environment:
      S3_BUCKET: ${S3_BUCKET:-mezzala-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: ["./storage/minio-init.sh:/init.sh:ro"]
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  worker:
    build: ./worker
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL_WORKER: postgres://mz_worker:${MZ_WORKER_PASSWORD}@db:5432/mezzala_gclub
      S3_BUCKET: ${S3_BUCKET:-mezzala-media}
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: eu-central-1
    restart: unless-stopped     # start it after `make migrate`; it exits-and-restarts until tables exist

volumes:
  mezzala-pg:
  mezzala-minio:
